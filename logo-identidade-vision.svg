<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Identidade Vision">
  <title>Identidade Vision</title>
  <defs>
    <!-- Fendas do cata-vento central, nas seis direcoes dos vertices do
         hexagono. Recortadas de verdade (mask) em vez de pintadas de
         branco, pra logo funcionar sobre fundo claro e escuro. -->
    <mask id="iv-fendas" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <g fill="#000">
        <polygon points="50,50 76.50,51.10 76.50,48.90"/>
        <polygon points="50,50 61.53,72.18 63.43,71.08"/>
        <polygon points="50,50 36.57,71.08 38.47,72.18"/>
        <polygon points="50,50 25.02,48.90 25.02,51.10"/>
        <polygon points="50,50 38.47,27.82 36.57,28.92"/>
        <polygon points="50,50 63.43,28.92 61.53,27.82"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#iv-fendas)">
    <!-- Hexagrama: triangulo verde pra baixo, triangulo roxo pra cima -->
    <polygon points="50,92 13.63,29 86.37,29" fill="#17D9A0"/>
    <polygon points="50,8 86.37,71 13.63,71" fill="#6C3CE9"/>

    <!-- Trama: no hexagono central cada cunha recebe a cor oposta a da
         ponta da estrela vizinha, e e isso que faz os dois triangulos
         continuarem legiveis por cima um do outro. -->
    <polygon points="50,50 37.88,29 62.12,29" fill="#17D9A0"/>
    <polygon points="50,50 74.25,50 62.12,71" fill="#17D9A0"/>
    <polygon points="50,50 37.88,71 25.75,50" fill="#17D9A0"/>

    <!-- Cata-vento: seis laminas saindo do centro na direcao de cada ponta
         da estrela, na mesma cor da ponta. A lamina atravessa a borda do
         hexagono e se funde com ela, formando uma forma continua do centro
         ate o vertice. -->
    <g>
      <path d="M50,50 L41.75,35.71 L50,20 L58.25,35.71 Z" fill="#6C3CE9"/>
      <path d="M50,50 L41.75,35.71 L50,20 L58.25,35.71 Z" fill="#17D9A0" transform="rotate(60 50 50)"/>
      <path d="M50,50 L41.75,35.71 L50,20 L58.25,35.71 Z" fill="#6C3CE9" transform="rotate(120 50 50)"/>
      <path d="M50,50 L41.75,35.71 L50,20 L58.25,35.71 Z" fill="#17D9A0" transform="rotate(180 50 50)"/>
      <path d="M50,50 L41.75,35.71 L50,20 L58.25,35.71 Z" fill="#6C3CE9" transform="rotate(240 50 50)"/>
      <path d="M50,50 L41.75,35.71 L50,20 L58.25,35.71 Z" fill="#17D9A0" transform="rotate(300 50 50)"/>
    </g>
  </g>
</svg>
